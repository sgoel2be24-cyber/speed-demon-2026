# Runs the code paths a Mac cannot run: the AVX2 build, on real x86-64, against seeds the
# board never uses. Lives outside track-b/, so it adds nothing to the entry's source size.
name: verify

on:
  push:
    paths-ignore:
      - "**.md"
      - verify/bench.py
      - verify/candidates.py
      - verify/phase.rs
      - .github/workflows/bench.yml
  workflow_dispatch:

jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show the CPU has AVX2
        run: grep -m1 -o avx2 /proc/cpuinfo

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build the same AVX2 paths as the Dockerfile
        working-directory: track-b
        run: |
          cargo rustc --release --verbose -- --print cfg | tee build-cfg.txt
          grep -qx 'target_feature="avx2"' build-cfg.txt
          cargo build --release --verbose

      - name: Check tally and query invariants against scalar oracles
        working-directory: verify/kernel_test
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          VERIFY_REQUIRE_AVX2: "1"
        run: cargo test --release -- --nocapture

      - name: Prove the AVX2 classifier correct for every byte
        working-directory: verify/classify_test
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo run --release | tee result.txt
          grep -q "AVX2 build: true" result.txt

      - name: Fetch the generators and the reference
        run: |
          git clone https://github.com/hackathon-raptors/speed-demon-2026 contest
          git -C contest checkout 9f059f75384607c7836997063b0901b98f36b5fa
          cmp track-b/generator/b_index.py contest/generators/b_index.py

      - name: Generate data and reference answers
        run: bash verify/generate.sh contest data python

      - name: Compare with the reference on every seed
        run: python verify/levels.py --data data --levels 0,1,2,3,4,5,7

      - name: Fuzz
        run: python verify/fuzz.py --reference contest/reference/b_index.py --rounds 300 --seed 4242 --keep .out/fuzz-failure

      - name: Check shard and block boundary regressions
        run: python verify/regressions.py --reference contest/reference/b_index.py

      - name: Build with AddressSanitizer
        working-directory: track-b
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: -C target-cpu=x86-64-v3 -Zsanitizer=address -Cdebuginfo=1
          CARGO_TARGET_DIR: ${{ github.workspace }}/.out/asan-target
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Check unsafe paths with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          binary="$PWD/.out/asan-target/x86_64-unknown-linux-gnu/release/solution"
          python verify/regressions.py --reference contest/reference/b_index.py --binary "$binary"
          python verify/fuzz.py --reference contest/reference/b_index.py --binary "$binary" --rounds 100 --seed 20261102 --keep .out/asan-fuzz-failure

      - name: Build and verify the actual PGO Docker image on holdout seeds
        run: python verify/docker.py --data data

      - name: Keep verification evidence and failing cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            track-b/build-cfg.txt
            .out/pgo/
            .out/*failure/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Download the evidence to verify retention
        uses: actions/download-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/retained-verification

      - name: Check the retained image hashes and outputs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/retained-verification
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          paths = list(pathlib.Path(os.environ["EVIDENCE_DIR"]).rglob("checks.json"))
          assert len(paths) == 1, paths
          metadata = json.loads(paths[0].read_text())
          assert metadata["architecture"] == "amd64", metadata
          assert metadata["fuzz"]["passed"] and metadata["regressions"]["passed"], metadata
          binary = paths[0].parent / "solution"
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == metadata["binary_sha256"]
          for case in metadata["full_cases"]:
              output = paths[0].parent / (case["dataset"] + "-results.txt")
              assert case["passed"] and hashlib.sha256(output.read_bytes()).hexdigest() == case["sha256"]
          print("PASS  downloaded PGO evidence: executable, both full outputs, fuzz and regressions")
          PY
