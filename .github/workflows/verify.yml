# A/B timing on one x86 machine. Lives only on the ab branch.
name: verify
on:
  push:
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026 contest
      - run: python contest/generators/b_index.py --seed 2 --scale full --out data
      - run: python ab.py
